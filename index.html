<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sports League Explorer</title>
    <meta
      name="description"
      content="Browse and explore sports leagues from around the world"
    />

    <!-- Start the TheSportsDB connection (DNS + TCP + TLS) while the JS
         bundle downloads, so the first API call skips the handshake. -->
    <link rel="preconnect" href="https://www.thesportsdb.com" crossorigin />

    <!-- Preload both Inter weights (400 body, 700 headings) so they are
         usually ready before first paint, keeping the font-display: swap
         FOUT window minimal. -->
    <link
      rel="preload"
      href="/fonts/inter-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/inter-latin-700-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-512.png" />

    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sports League Explorer" />
    <meta
      property="og:description"
      content="Browse and explore sports leagues from around the world"
    />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sports League Explorer" />
    <meta
      name="twitter:description"
      content="Browse and explore sports leagues from around the world"
    />
    <meta name="twitter:image" content="/og-image.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
